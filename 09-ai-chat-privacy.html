<style>
:root{--orange:#FF6B1A;--paper:#FAF7F1;--ink:#1A1A1A;--line:rgba(26,26,26,.19);--muted:rgba(26,26,26,.72)}*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}button,a,summary{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:4px}button{cursor:pointer}a{color:inherit;text-underline-offset:4px}main{max-width:880px;padding:32px 28px 22px;margin:auto}header{border-top:5px solid var(--orange);padding-top:20px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;display:flex;justify-content:space-between;gap:16px;margin:0 0 17px}.eyebrow span:last-child{color:var(--muted);letter-spacing:0;font-weight:500}h1{font-size:34px;letter-spacing:-.035em;line-height:1.32;margin:0 0 14px;font-weight:850}h1 span{color:var(--orange)}.lead{font-size:16px;line-height:1.85;color:var(--muted);margin:0;max-width:700px}.scenario{display:flex;align-items:center;gap:24px;padding:20px 0;margin:15px 0 18px;border-bottom:1px solid var(--line)}.file{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700}.file svg{width:34px;height:42px;color:var(--orange)}.prompt{border:1px solid var(--ink);border-radius:14px 14px 14px 0;padding:11px 18px;font-size:16px}.scenario-label{font-size:12px;color:var(--muted);display:block;font-weight:400;margin-bottom:3px}.how{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 13px;font-size:13px;color:var(--muted)}.how strong{color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:stretch}.card{background:transparent;border:1px solid var(--line);text-align:left;padding:19px 18px 16px;min-height:174px;display:flex;flex-direction:column;position:relative;border-radius:2px;transition:border-color .15s,background .15s}.card:hover{border-color:var(--ink);background:rgba(26,26,26,.025)}.card[aria-expanded=true]{border:2px solid var(--orange);padding:18px 17px 15px;background:rgba(255,107,26,.035)}.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.num{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--orange);line-height:1}.tag{font-size:11px;color:var(--muted)}.card h2{font-size:19px;line-height:1.4;margin:0 0 8px;font-weight:750}.card p{font-size:14px;line-height:1.65;margin:0;padding-right:18px;color:var(--muted)}.plus{font-size:24px;position:absolute;bottom:13px;right:15px;font-weight:400;line-height:1}.panel{grid-column:1/-1;border:1px solid var(--ink);padding:24px;position:relative;scroll-margin-top:16px}.panel-heading{display:flex;gap:12px;align-items:baseline;padding-right:60px;margin-bottom:19px}.panel-heading h2{font-size:24px;margin:0}.panel-heading .num{font-size:24px}.close{position:absolute;right:16px;top:17px;border:0;background:none;font-size:13px;padding:8px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:24px}.company{font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px;margin:0 0 7px}.company img{width:18px;height:18px;object-fit:contain}.detail-text{font-size:15px;line-height:1.85;margin:0}.action{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.action h3{font-size:14px;margin:0 0 6px;font-weight:800}.action h3:before{content:'↳';color:var(--orange);margin-right:8px}.note{font-size:13px;line-height:1.8;color:var(--muted);margin:16px 0 0}.sources{display:flex;flex-wrap:wrap;gap:8px 17px;margin-top:13px;font-size:11px;line-height:1.6}.sources a{color:var(--muted)}.takeaway{border-top:2px solid var(--ink);margin:22px 0 0;padding-top:17px;display:flex;gap:20px;align-items:baseline}.takeaway strong{font-size:12px;white-space:nowrap;color:var(--orange)}.takeaway p{font-size:17px;line-height:1.7;font-weight:700;margin:0}footer{display:flex;justify-content:space-between;gap:18px;border-top:1px solid var(--line);padding-top:14px;margin-top:21px;font-size:11px;line-height:1.7;color:var(--muted)}.mobile{display:none}.preview-tools{display:none;padding:12px 20px;background:var(--ink);color:var(--paper);align-items:center;justify-content:center;gap:12px;font-size:12px}.preview-tools button{border:1px solid var(--paper);background:transparent;color:var(--paper);padding:7px 12px}.preview-tools button[aria-pressed=true]{background:var(--orange);border-color:var(--orange);color:var(--ink)}.preview-frame{display:block;margin:auto;width:100%;border:0;height:1200px}.mobile-item{border:1px solid var(--line);margin-bottom:10px}.mobile-item[open]{border-color:var(--orange)}summary{list-style:none;cursor:pointer;padding:17px 16px;position:relative}summary::-webkit-details-marker{display:none}summary .num{font-size:21px;margin-right:11px}summary h2{font-size:18px;display:inline;margin:0}summary p{font-size:14px;line-height:1.7;margin:8px 23px 0 34px;color:var(--muted)}summary .plus{bottom:auto;top:18px}.mobile-detail{border-top:1px solid var(--line);padding:19px 16px}.mobile-detail .compare{display:block}.mobile-detail .compare section+section{margin-top:19px}.mobile-detail .action{margin-top:17px}.mobile-detail .sources{font-size:12px}.mobile-detail .detail-text{font-size:15px}.mobile-detail .note{font-size:13px}.mobile-detail h3{font-size:14px}
@media(max-width:640px){main{padding:23px 17px 19px}h1{font-size:28px;max-width:350px}header{padding-top:16px}.eyebrow{font-size:11px;margin-bottom:15px}.eyebrow span:last-child{font-size:10px}.lead{font-size:14px;line-height:1.85}.scenario{gap:13px;flex-wrap:wrap;padding:16px 0;margin:8px 0 17px}.file{font-size:15px;gap:9px}.file svg{width:28px;height:34px}.prompt{font-size:14px;padding:9px 13px}.scenario-label{font-size:10px}.how{font-size:12px;align-items:flex-start}.how span{max-width:170px;text-align:right}.desktop{display:none}.mobile{display:block}.takeaway{display:block;margin-top:19px}.takeaway strong{display:block;margin-bottom:5px}.takeaway p{font-size:17px}footer{display:block;font-size:10px}footer span{display:block}footer span+span{margin-top:4px}.preview-tools{flex-wrap:wrap}}

<body>
<div class="preview-tools" id="preview-tools"><span>版面預覽</span><button type="button" data-width="880" aria-pressed="true">桌機</button><button type="button" data-width="390" aria-pressed="false">手機</button></div>
<main id="widget">
<header><p class="eyebrow"><span>數位時代 BUSINESS NEXT</span><span>AI隱私指南</span></p><h1>一份合約的<span>9個</span>隱私環節</h1><p class="lead">你按下送出後，合約會去哪裡？點開卡片，比較ChatGPT與Claude的處理方式，以及你能控制的設定。</p></header>
<div class="scenario" aria-label="示意情境：上傳客戶合約，請AI摘要風險"><div class="file"><svg viewBox="0 0 34 42" fill="none" aria-hidden="true"><path d="M3 1h18l10 10v30H3zM21 1v11h10M9 22h16M9 28h16M9 34h10" stroke="currentColor" stroke-width="2"/></svg><div><span class="scenario-label">示意情境</span>客戶合約.pdf</div></div><div class="prompt">幫我摘要風險</div></div>
<div class="how"><strong>點選任一卡片，查看細節</strong><span>編號方便查找，並非先後順序<br>也不是每份合約都會經過全部環節</span></div>
<div class="desktop grid" id="grid"></div><div class="mobile" id="mobile"></div>
<noscript><p>請啟用JavaScript，以展開9個隱私環節的比較說明。</p></noscript>
<aside class="takeaway"><strong>先記住這件事</strong><p>關閉訓練、關閉記憶、刪除對話，<br class="desktop">是三件不同的事。</p></aside>
<footer><span>範圍：一般使用者服務；商用方案與例外另註。<br>政策可能更新，請以各卡片連結的官方說明為準。</span><span>資料核對：2026年9月14日<br>製作：數位時代</span></footer>
</main>
<script>
const cards=[{"title": "加密傳輸", "tag": "傳送時", "summary": "途中有加密，不代表平台不能讀。", "gpt": "合約會透過受保護的連線傳送。平台仍需處理內容，才能產生回答。", "claude": "傳輸與儲存時均採加密措施；加密不等於只有你能讀取。", "action": "先遮掉不必要的姓名、帳號與商業機密，再上傳需要分析的段落。", "note": "這不是只有收發雙方能解密的通訊保證；授權存取仍受平台政策規範。", "sources": [["OpenAI資料安全", "https://openai.com/enterprise-privacy/"], ["Anthropic資料保護", "https://privacy.claude.com/en/articles/10458704-how-does-anthropic-protect-the-personal-data-of-claude-users"]]}, {"title": "平台保存", "tag": "回答之後", "summary": "關閉訓練，對話仍可能留在帳號裡。", "gpt": "一般對話會保留到你刪除為止。關閉模型改善，不會刪掉聊天紀錄。", "claude": "一般對話也會留在歷史紀錄。關閉模型改善，不代表30天後自動清除所有對話。", "action": "用完後檢查對話與檔案保存位置；不需留存的內容，另行刪除。", "note": "臨時／無痕對話另有保留規則。企業方案也可能採自訂保存政策。", "sources": [["ChatGPT對話與檔案保存", "https://help.openai.com/en/articles/8983778-chat-and-file-retention-policies-in-chatgpt"], ["Claude資料保留", "https://privacy.claude.com/en/articles/10023548-how-long-do-you-store-my-data"]]}, {"title": "模型回答", "tag": "產生回答", "summary": "讀取合約作答，與拿去訓練是兩回事。", "gpt": "為了摘要合約，模型會使用這次提供的內容。一般推論不會即時把對話寫進模型參數。", "claude": "同樣會利用輸入內容作答。這不等於這份合約一定會成為日後的訓練資料。", "action": "分開看「這次怎麼回答」與「資料日後怎麼使用」，再檢查訓練和記憶設定。", "note": "不能因此保證模型不會重現訓練內容。「不像資料庫」不等於完全沒有記憶或洩漏風險。", "sources": [["OpenAI模型改善政策", "https://help.openai.com/en/articles/5722486-how-your-data-is-used-to-improve-model-performance"], ["Anthropic訓練資料說明", "https://privacy.claude.com/en/articles/15865314-privacy-rights-requests-relating-to-anthropic-s-training-data"]]}, {"title": "安全檢查", "tag": "依安全機制", "summary": "關閉訓練，仍可能接受安全檢查。", "gpt": "平台可能處理內容，以偵測濫用、資安事件或違反政策的行為。", "claude": "系統也會偵測政策違規；被標記的內容可能進入額外安全審查。", "action": "別把「不供模型改善」理解為「系統不再檢查內容」。", "note": "安全用途與一般模型改善不同。被標記內容的保留與使用可能有額外例外，不能套用一般刪除期限。", "sources": [["OpenAI資料使用", "https://help.openai.com/en/articles/7039943-data-usage-for-consumer-services-faq"], ["Anthropic模型訓練政策", "https://privacy.claude.com/en/articles/10023580-is-my-data-used-for-model-training"]]}, {"title": "人工檢視", "tag": "特定情況", "summary": "授權人員可能查看，但非每則都人工讀。", "gpt": "少數授權人員與受保密義務約束的服務商，可能因安全、客服、法律或模型改善需要存取內容。", "claude": "依安全審查、使用者回饋等條件，授權人員可能檢視內容。", "action": "客服求助或提交回饋前，確認整段對話是否包含敏感資料。", "note": "關閉模型改善可限制相應用途，無法同時排除安全、客服或法律所需的存取。", "sources": [["OpenAI人工存取條件", "https://help.openai.com/en/articles/7039943-data-usage-for-consumer-services-faq"], ["Anthropic資料保護", "https://privacy.claude.com/en/articles/10458704-how-does-anthropic-protect-the-personal-data-of-claude-users"]]}, {"title": "歷史與記憶", "tag": "跨次對話", "summary": "關閉記憶，不會順便刪掉既有內容。", "gpt": "聊天紀錄與記憶分開管理。關閉記憶功能，不等於刪除已保存的記憶。", "claude": "暫停記憶與重設記憶不同；暫停不會自動清除既有記憶，也不會刪除對話。", "action": "需要移除資訊時，分別處理記憶與相關對話、檔案等來源。Claude需選擇「重設記憶」才會刪除既有記憶。", "note": "ChatGPT臨時對話不建立新記憶，但可能使用既有記憶做個人化；開始時選擇非個人化，才能避免使用。", "sources": [["ChatGPT記憶設定", "https://help.openai.com/en/articles/8590148-memory-faq"], ["Claude搜尋與記憶", "https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context"], ["ChatGPT臨時對話", "https://help.openai.com/en/articles/8914046-temporary-chat-faq"]]}, {"title": "刪除資料", "tag": "主動清除", "summary": "按下刪除，不等於所有副本立即消失。", "gpt": "刪除對話後，通常安排於30天內永久刪除；已去識別化並與帳號分離、安全或法律保留等情況除外。", "claude": "手動刪除後，通常於30天內從後端刪除；安全、法律等例外可能延長保留。", "action": "ChatGPT若有Library，須另刪其中的檔案。也要檢查記憶、分享與第三方保存的副本。", "note": "Claude無痕對話預設保留30天，企業政策可能更長，企業擁有者也可能匯出。ChatGPT臨時對話若存為一般對話，改依帳號設定處理。", "sources": [["ChatGPT刪除與檔案", "https://help.openai.com/en/articles/8983778-chat-and-file-retention-policies-in-chatgpt"], ["Claude資料保留", "https://privacy.claude.com/en/articles/10023548-how-long-do-you-store-my-data"], ["Claude無痕對話", "https://support.claude.com/en/articles/12260368-use-incognito-chats"], ["ChatGPT臨時對話", "https://help.openai.com/en/articles/8914046-temporary-chat-faq"]]}, {"title": "模型訓練", "tag": "視方案與設定", "summary": "是否用於改善模型，要看設定與例外。", "gpt": "個人服務的內容可能用於模型改善；關閉後，新對話不供一般模型訓練。主動提交回饋時，相關整段對話仍可能用於訓練。", "claude": "關閉模型改善後，舊與新對話不再用於未來訓練；已開始的訓練、已完成的模型不受影響。主動回饋與安全用途另有例外。", "action": "ChatGPT：設定→資料控管→關閉「為所有人改善模型」。Claude：設定→隱私權→關閉模型改善。敏感對話避免另送回饋。", "note": "商用與API方案通常預設不使用輸入、輸出訓練一般模型，仍須看各方案、額外同意與安全規則。關閉訓練不等於刪除資料。", "sources": [["OpenAI模型改善政策", "https://help.openai.com/en/articles/5722486-how-your-data-is-used-to-improve-model-performance"], ["Anthropic模型訓練政策", "https://privacy.claude.com/en/articles/10023580-is-my-data-used-for-model-training"], ["Anthropic退出與刪除", "https://privacy.claude.com/en/articles/10023548-how-long-do-you-store-my-data"]]}, {"title": "分享與外部存取", "tag": "開啟其他途徑", "summary": "分享與外部工具，會改變資料能到哪裡。", "gpt": "分享連結的持有人可能讀到分享內容。連接外部App或工具時，必要資料也可能傳給第三方。", "claude": "分享對話、使用連接器或其他外部工具，同樣可能讓資料離開原平台的處理範圍。", "action": "定期取消不需要的分享、檢查連接器與擴充套件權限；使用前確認第三方的資料政策。", "note": "取消分享不會收回他人已複製的內容。依法調閱則是另一條途徑，不能靠關閉分享或訓練來排除。", "sources": [["ChatGPT分享連結", "https://help.openai.com/en/articles/7925741-chatgpt-shared-links-faq"], ["OpenAI隱私政策", "https://openai.com/policies/privacy-policy/"], ["Anthropic隱私政策", "https://www.anthropic.com/legal/privacy"]]}];
const grid=document.querySelector('#grid'),mobile=document.querySelector('#mobile');
const n=i=>String(i+1).padStart(2,'0');
function content(c){return `<div class="compare"><section><h3 class="company"><img src="https://www.google.com/s2/favicons?sz=64&domain=openai.com" alt="" onerror="this.style.visibility='hidden'">ChatGPT怎麼處理</h3><p class="detail-text">${c.gpt}</p></section><section><h3 class="company"><img src="https://www.google.com/s2/favicons?sz=64&domain=claude.ai" alt="" onerror="this.style.visibility='hidden'">Claude怎麼處理</h3><p class="detail-text">${c.claude}</p></section></div><div class="action"><h3>你能做什麼？</h3><p class="detail-text">${c.action}</p></div><p class="note"><strong>留意例外：</strong>${c.note}</p><nav class="sources" aria-label="官方資料來源">${c.sources.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener noreferrer">${s[0]} ↗</a>`).join('')}</nav>`}
let selected=-1;
function render(){grid.replaceChildren();cards.forEach((c,i)=>{let b=document.createElement('button');b.type='button';b.className='card';b.id='card-'+i;b.setAttribute('aria-expanded',String(selected===i));b.setAttribute('aria-controls','panel');b.innerHTML=`<div class="card-top"><span class="num">${n(i)}</span><span class="tag">${c.tag}</span></div><h2>${c.title}</h2><p>${c.summary}</p><span class="plus" aria-hidden="true">${selected===i?'−':'+'}</span>`;b.addEventListener('click',()=>{selected=selected===i?-1:i;render();document.querySelector('#card-'+i).focus({preventScroll:true});if(selected>=0)document.querySelector('#panel').scrollIntoView({behavior:'smooth',block:'nearest'});});grid.append(b);if(i%3===2&&selected>=i-2&&selected<=i){let p=document.createElement('section');p.className='panel';p.id='panel';p.setAttribute('aria-labelledby','panel-title');p.innerHTML=`<div class="panel-heading"><span class="num">${n(selected)}</span><h2 id="panel-title">${cards[selected].title}</h2></div><button class="close" type="button" aria-label="收合詳細說明">收合 ×</button>${content(cards[selected])}`;p.querySelector('.close').onclick=()=>{const old=selected;selected=-1;render();document.querySelector('#card-'+old).focus({preventScroll:true});};grid.append(p);}});reportHeight();}
render();
cards.forEach((c,i)=>{const d=document.createElement('details');d.className='mobile-item';d.innerHTML=`<summary><span class="num">${n(i)}</span><h2>${c.title}</h2><p>${c.summary}</p><span class="plus" aria-hidden="true">+</span></summary><div class="mobile-detail">${content(c)}</div>`;d.addEventListener('toggle',()=>{d.querySelector('.plus').textContent=d.open?'−':'+';reportHeight();});mobile.append(d);});
function reportHeight(){requestAnimationFrame(()=>{const h=Math.ceil(document.querySelector("#widget").getBoundingClientRect().height);if(window.parent!==window)window.parent.postMessage({type:'resize',height:h,source:'bn-privacy-widget'},'*');});}
new ResizeObserver(reportHeight).observe(document.querySelector('#widget'));
window.addEventListener('load',reportHeight);
if(new URLSearchParams(location.search).get('preview')==='1'){const toolbar=document.querySelector('#preview-tools');toolbar.style.display='flex';document.querySelector('#widget').hidden=true;const frame=document.createElement('iframe');frame.className='preview-frame';frame.title='隱私配件預覽';frame.src=location.pathname+'?embed=1';frame.style.maxWidth='880px';document.body.append(frame);toolbar.querySelectorAll('button').forEach(b=>b.onclick=()=>{frame.style.maxWidth=b.dataset.width+'px';toolbar.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.source==='bn-privacy-widget')frame.style.height=e.data.height+'px';});}
</script>
</body></html>
