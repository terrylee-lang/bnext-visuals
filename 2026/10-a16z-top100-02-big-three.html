<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三巨頭對決：ChatGPT的領先有多大 ｜ 數位時代</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: #FAF7F1;
    color: #1A1A1A;
    font-family: "Inter", "Noto Sans TC", "PingFang TC", -apple-system, "Microsoft JhengHei", sans-serif;
    padding: 32px 16px 48px;
    text-wrap: pretty;
    line-height: 1.8;
  }
  .wrapper {
    max-width: 880px;
    margin: 0 auto;
    container-type: inline-size;
    transition: max-width 0.25s ease;
  }
  h1, h2, .section-headline, .deck { text-wrap: balance; }
  .num { font-family: "Inter", "Noto Sans TC", sans-serif; font-feature-settings: "tnum" 1; }

  /* header */
  header { margin-bottom: 20px; }
  .kicker {
    display: inline-block;
    font-size: 13px; font-weight: 700; letter-spacing: 0.12em;
    color: #FF6B1A;
    border: 1px solid #FF6B1A;
    padding: 4px 12px;
    margin-bottom: 16px;
  }
  h1 { font-size: 34px; line-height: 1.35; font-weight: 900; letter-spacing: 0.02em; margin-bottom: 12px; }
  h1 .u {
    text-decoration: underline; text-decoration-thickness: 4px;
    text-underline-offset: 6px; text-decoration-color: #FF6B1A;
  }
  .deck { font-size: 17px; color: #1A1A1A; line-height: 1.8; max-width: 640px; }

  .meta-bar {
    display: flex; flex-wrap: wrap; gap: 8px 0;
    border-top: 1px solid #D4D0C8; border-bottom: 1px solid #D4D0C8;
    padding: 10px 0; margin-bottom: 32px;
    font-size: 13px; color: #5C6470;
  }
  .meta-chunk { white-space: nowrap; }
  .meta-sep { margin: 0 10px; color: #D4D0C8; }

  /* stats strip */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    margin-bottom: 56px;
  }
  .stat {
    background: #F5F3EF; border: 1px solid #D4D0C8; border-radius: 8px;
    padding: 20px 16px;
  }
  .stat .v { font-size: 30px; font-weight: 700; color: #FF6B1A; line-height: 1.2; margin-bottom: 6px; }
  .stat .l { font-size: 13px; color: #5C6470; line-height: 1.6; }

  /* sections */
  .section { margin-bottom: 56px; }
  .section-title {
    font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #5C6470;
    margin-bottom: 8px;
  }
  .section-headline { font-size: 24px; font-weight: 900; line-height: 1.4; margin-bottom: 8px; letter-spacing: 0.02em; }
  .section-sub { font-size: 15px; color: #5C6470; line-height: 1.7; margin-bottom: 20px; max-width: 680px; }

  /* tabs */
  .tabs { display: flex; gap: 0; margin-bottom: 20px; border: 1px solid #D4D0C8; border-radius: 8px; overflow: hidden; width: fit-content; max-width: 100%; }
  .tabs button {
    font-family: inherit; font-size: 14px; font-weight: 500;
    background: #FAF7F1; color: #1A1A1A; border: 0; border-right: 1px solid #D4D0C8;
    padding: 10px 20px; cursor: pointer; white-space: nowrap;
  }
  .tabs button:last-child { border-right: 0; }
  .tabs button[aria-pressed="true"] { background: #1A1A1A; color: #FAF7F1; font-weight: 700; }

  /* fig1 bars */
  .bar-row { display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: center; margin-bottom: 14px; }
  .bar-name { font-size: 15px; font-weight: 700; }
  .bar-track { background: #ECE8DF; border-radius: 8px; height: 34px; position: relative; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 8px; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; min-width: 44px; }
  .bar-fill.lead { background: #FF6B1A; }
  .bar-fill.rest { background: #D4D0C8; }
  .bar-fill .bv { font-size: 13px; font-weight: 700; color: #1A1A1A; }
  .bar-fill.lead .bv { color: #fff; }
  .bar-idx { font-size: 14px; font-weight: 700; text-align: right; }
  .fig-note { font-size: 13px; color: #5C6470; margin-top: 12px; line-height: 1.7; }

  /* fig2 stacked */
  .stack { display: flex; height: 64px; border-radius: 8px; overflow: hidden; border: 1px solid #D4D0C8; margin-bottom: 8px; }
  .stack div { display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
  .stack .s1 { background: #FF6B1A; color: #fff; }
  .stack .s2 { background: #E3DECF; color: #1A1A1A; }
  .stack .s3 { background: #ECE8DF; color: #1A1A1A; }
  .stack .s4 { background: #F5F3EF; color: #1A1A1A; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: #5C6470; margin-bottom: 24px; }
  .legend .dot { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .callout {
    border-left: 4px solid #FF6B1A; background: #F5F3EF;
    padding: 16px 20px; border-radius: 0 8px 8px 0;
  }
  .callout .big { font-size: 26px; font-weight: 900; line-height: 1.3; }
  .callout .big .o { color: #FF6B1A; }
  .callout p { font-size: 14px; color: #5C6470; margin-top: 6px; line-height: 1.7; }

  /* fig3 agent cards */
  .agent-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .agent {
    background: #F5F3EF; border: 1px solid #D4D0C8; border-radius: 8px;
    padding: 24px 22px;
  }
  .agent .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; padding: 3px 10px; border-radius: 999px; margin-bottom: 12px; }
  .agent.muse .tag { background: #1A1A1A; color: #FAF7F1; }
  .agent.instinct .tag { background: #FF6B1A; color: #fff; }
  .agent h3 { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
  .agent .en { font-size: 13px; color: #8A93A0; margin-bottom: 14px; }
  .agent ul { list-style: none; }
  .agent li { font-size: 14px; line-height: 1.7; padding: 8px 0; border-top: 1px solid #D4D0C8; }
  .agent li b { font-weight: 700; }
  .agent li .o { color: #FF6B1A; font-weight: 700; }

  /* fig4 ranking explorer */
  .rank-tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
  .search {
    font-family: inherit; font-size: 14px; padding: 10px 14px;
    border: 1px solid #D4D0C8; border-radius: 8px; background: #FAF7F1; color: #1A1A1A;
    width: 220px;
  }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-family: inherit; font-size: 13px; padding: 8px 14px; border-radius: 999px;
    border: 1px solid #D4D0C8; background: #FAF7F1; color: #1A1A1A; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: #1A1A1A; color: #FAF7F1; border-color: #1A1A1A; font-weight: 700; }
  .rank-src { font-size: 13px; color: #5C6470; margin-bottom: 12px; }
  .rank-list { border: 1px solid #D4D0C8; border-radius: 8px; overflow: hidden; }
  .rank-row {
    display: grid; grid-template-columns: 40px 30px 1fr auto; gap: 10px; align-items: center;
    padding: 10px 16px; background: #FAF7F1; border-bottom: 1px solid #ECE8DF;
    font-size: 15px;
  }
  .rank-row:last-child { border-bottom: 0; }
  .rank-row:nth-child(even) { background: #F5F3EF; }
  .rank-row .rk { font-weight: 700; color: #8A93A0; }
  .rank-row.top3 .rk { color: #FF6B1A; }
  .rank-row .logo { width: 22px; height: 22px; border-radius: 4px; flex-shrink: 0; background: #FAF7F1; border: 1px solid #D4D0C8; object-fit: contain; }
  .rank-row .logo.ph { visibility: hidden; }
  .rank-row .nm { font-weight: 500; }
  .rank-row .nm .gloss { font-size: 12px; color: #8A93A0; margin-left: 6px; font-weight: 400; }
  .badges { display: flex; gap: 6px; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.triple { background: #FF6B1A; color: #fff; }
  .badge.hidden { background: #1A1A1A; color: #FAF7F1; }
  .rank-empty { padding: 32px; text-align: center; color: #8A93A0; font-size: 14px; }
  .rank-foot { font-size: 13px; color: #5C6470; margin-top: 12px; line-height: 1.7; }

  footer {
    border-top: 1px solid #D4D0C8; padding-top: 16px; margin-top: 8px;
    font-size: 13px; color: #5C6470; line-height: 1.7;
  }
  footer strong { color: #1A1A1A; }

  /* preview toolbar (editor only, ?preview=1) */
  #pvbar {
    display: none; position: fixed; top: 14px; right: 14px; z-index: 9999;
    background: #0F1A2E; color: #FAF7F1; border-radius: 8px; padding: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }
  #pvbar.on { display: flex; gap: 8px; align-items: center; }
  #pvbar span { font-size: 12px; padding: 0 4px; }
  #pvbar button {
    font-family: inherit; font-size: 13px; font-weight: 500;
    background: transparent; color: #FAF7F1; border: 1px solid #5C6470;
    border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  #pvbar button[aria-pressed="true"] { background: #FF6B1A; border-color: #FF6B1A; font-weight: 700; }

  /* mobile dual-track */
  @container (max-width: 640px) {
    .stats { grid-template-columns: 1fr 1fr; }
    .stat .v { font-size: 26px; }
    h1 { font-size: 26px; }
    .section-headline { font-size: 20px; }
    .agent-grid { grid-template-columns: 1fr; }
    .bar-row { grid-template-columns: 88px 1fr; }
    .bar-name { font-size: 13px; }
    .tabs { width: 100%; }
    .tabs button { flex: 1; padding: 10px 8px; font-size: 13px; }
    .search { width: 100%; }
    .meta-sep { display: none; }
    .meta-chunk { display: block; }
    .stack div { font-size: 11px; }
    .callout .big { font-size: 22px; }
  }
  @media (max-width: 640px) {
    body { padding: 20px 10px 36px; }
  }
</style>
</head>
<body>
<div class="wrapper">
  <div class="kicker">榜單解讀 · INTERACTIVE</div>
  
  <div class="meta-bar">
    <span class="meta-chunk">資料來源：<strong>a16z、YipitData、SimilarWeb、Sensor Tower</strong></span><span class="meta-sep">|</span>
    <span class="meta-chunk">數據月份：2026年8月</span><span class="meta-sep">|</span>
    <span class="meta-chunk">製作：《數位時代》</span>
  </div>
<div class="section-title">FIGURE 01 · MARKET LEADERS</div>
    <h2 class="section-headline">三巨頭對決：ChatGPT的領先有多大</h2>
    <p class="section-sub">切換三種維度，看ChatGPT、Gemini、Claude的真實差距。數字為指數化示意，以ChatGPT為100換算自官方公布的倍數關係。</p>
    <div class="tabs" role="group" aria-label="三巨頭比較維度">
      <button aria-pressed="true" data-big3="web">網頁造訪</button>
      <button aria-pressed="false" data-big3="mobile">手機月活</button>
      <button aria-pressed="false" data-big3="paid">美國付費訂戶</button>
    </div>
    <div id="big3bars"></div>
    <p class="fig-note" id="big3note"></p>
  <footer>
    <strong>《數位時代》</strong>　|　資料來源：a16z第7版Top 100報告（2026年10月5日）　|　製圖：2026年10月6日
  </footer>
</div>
<div id="pvbar" role="toolbar" aria-label="預覽模式切換">
  <span>預覽</span>
  <button id="pvDesk" aria-pressed="true">桌機</button>
  <button id="pvMob" aria-pressed="false">手機</button>
</div>
<script>
(function(){
  "use strict";

  var big3 = {
    web: {
      rows: [["ChatGPT",100],["Gemini",50],["Claude",17]],
      note: "ChatGPT網頁造訪量約為Gemini 2倍、Claude 6倍。資料來源：SimilarWeb，2026年8月。"
    },
    mobile: {
      rows: [["ChatGPT",100],["Gemini",40],["Claude",7]],
      note: "ChatGPT手機月活約為Gemini 2.5倍、Claude 14倍。資料來源：Sensor Tower，2026年8月。"
    },
    paid: {
      rows: [["ChatGPT",100],["Claude",34],["Gemini",31]],
      note: "ChatGPT美國付費訂戶約為另外兩家3倍；Claude今年已超車Gemini。資料來源：YipitData美國，2026年8月。"
    }
  };
  var barsEl = document.getElementById("big3bars");
  var noteEl = document.getElementById("big3note");
  function renderBig3(key){
    var d = big3[key];
    var html = "";
    d.rows.forEach(function(r, i){
      html += '<div class="bar-row">'
        + '<div class="bar-name">' + r[0] + '</div>'
        + '<div class="bar-track"><div class="bar-fill ' + (i===0 ? "lead" : "rest") + '" style="width:' + r[1] + '%"><span class="bv num">' + r[1] + '</span></div></div>'
        + '</div>';
    });
    barsEl.innerHTML = html;
    noteEl.textContent = d.note;
  }
  document.querySelectorAll("[data-big3]").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll("[data-big3]").forEach(function(b){ b.setAttribute("aria-pressed","false"); });
      btn.setAttribute("aria-pressed","true");
      renderBig3(btn.getAttribute("data-big3"));
    });
  });
  renderBig3("web");

  
  if (new URLSearchParams(location.search).has("preview")) {
    var bar = document.getElementById("pvbar");
    bar.classList.add("on");
    var wrap = document.querySelector(".wrapper");
    var bD = document.getElementById("pvDesk"), bM = document.getElementById("pvMob");
    bD.addEventListener("click", function(){
      wrap.style.maxWidth = "880px";
      bD.setAttribute("aria-pressed","true"); bM.setAttribute("aria-pressed","false");
    });
    bM.addEventListener("click", function(){
      wrap.style.maxWidth = "390px";
      bM.setAttribute("aria-pressed","true"); bD.setAttribute("aria-pressed","false");
    });
  }
})();
</script>
</body>
</html>
