</section>
<p class="reminder"><strong>先問清楚再關：</strong>各行關閉後的恢復要求，請向銀行確認。網銀／行動銀行與金融卡、ATM可能各有開關；已綁定的電子支付扣款也要另外檢查。</p>

 $('written').textContent=notes[b.name]||'';b.refs.forEach(([label,url])=>{const a=node('a',label+' ↗');a.href=url;a.target='_blank';a.rel='noopener noreferrer';$('sources').append(a);});$('status').textContent='已顯示'+b.name+'的關閉方式與客服資訊。';sendHeight();}
$('copy').addEventListener('click',async()=>{const text=$('ask-text').textContent;try{await navigator.clipboard.writeText(text);$('copy-status').textContent='問句已複製。';}catch(e){const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}area.remove();if(ok){$('copy-status').textContent='問句已複製。';}else{const range=document.createRange();range.selectNodeContents($('ask-text'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);$('copy-status').textContent='已選取問句，請長按或使用複製快捷鍵。';}}sendHeight();});
function sendHeight(){requestAnimationFrame(()=>{const height=document.querySelector("#canvas").scrollHeight;parent.postMessage({type:"iframe-height",height},"*");parent.postMessage({type:"resize",height},"*");});}
banks.forEach(bank=>{const o=node("option",bank.name);o.value=bank.name;$("bank").append(o);});
$("bank").addEventListener("change",e=>render(e.target.value));
document.querySelector("details").addEventListener("toggle",sendHeight);
window.addEventListener("resize",sendHeight);if(document.fonts)document.fonts.ready.then(sendHeight);
if(new URLSearchParams(location.search).get("preview")==="1"){document.body.classList.add("preview");document.querySelectorAll("[data-width]").forEach(b=>b.addEventListener("click",()=>{const width=b.dataset.width;$("canvas").style.maxWidth=width+"px";document.querySelectorAll("[data-width]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));sendHeight();}));if(new URLSearchParams(location.search).get("mobile")==="1"){document.querySelector('meta[name="viewport"]').content="width=390";$("canvas").style.maxWidth="390px";document.querySelectorAll("[data-width]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.width==="390")));}}
render(banks[0].name);
</script>
</body>
</html>
