<!DOCTYPE html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美國期中選舉開票進度</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #FAF7F1; color: #1A1A1A; font: 16px/1.6 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
main { max-width: 880px; margin: auto; padding: 20px; }
h1 { font-size: clamp(22px, 5vw, 30px); margin: 0; }
nav { display: flex; gap: 8px; margin: 16px 0; }
button { flex: 1; font: inherit; padding: 8px 2px; border: 1px solid #D4D0C8; background: #F5F3EF; color: inherit; cursor: pointer; }
button[aria-pressed="true"] { border-bottom: 3px solid #FF6B1A; font-weight: bold; }
ul { padding: 0; list-style: none; }
#cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 8px; }
#cards li {
  position: relative;
  padding: 14px;
  border: 1px solid rgba(15, 26, 46, .12);
  border-radius: 8px;
  background: #F5F3EF;
  min-width: 0;
}
@media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
  #cards[data-spotlight] li::after,
  #cards[data-spotlight] li::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
  }
  #cards[data-spotlight] li::after {
    background: radial-gradient(120px circle at var(--x, -999px) var(--y, -999px),
      #FF6B1A09, transparent);
  }
  @supports (mask-composite: exclude) {
    #cards[data-spotlight] li::before {
      inset: -1px;
      padding: 1px;
      background: radial-gradient(140px circle at var(--x, -999px) var(--y, -999px),
        #FF6B1A70, transparent);
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
    }
  }
}
#cards strong { display: block; font-size: 18px; color: #0F1A2E; margin-bottom: 6px; }
#cards li[data-empty] { color: #5C6470; font-size: 13px; }
.candidate { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 3px 10px; padding: 7px 8px; border-left: 4px solid var(--party-color); border-top: 1px solid rgba(15,26,46,.12); }
.candidate-name { font-size: 14px; font-weight: 650; overflow-wrap: anywhere; }
.candidate-meta { display: block; font-size: 12px; color: #5C6470; font-weight: 400; }
.candidate-count { text-align: right; font-size: 14px; font-variant-numeric: tabular-nums; }
.candidate-head { display: flex; justify-content: space-between; color: #5C6470; font-size: 12px; padding: 2px 8px; }
.candidate:nth-of-type(even) { background: #ECE8DF; }
.candidate { --party-color: #5C6470; }
.candidate[data-party="D"] { --party-color: #176697; }
.candidate[data-party="R"] { --party-color: #B52640; }
.candidate-name .candidate-meta { color: var(--party-color); font-weight: 650; }
.candidate[data-party="I"] { --party-color: #36794D; }
#bar { display: flex; height: 12px; overflow: hidden; }
#races li { border-top: 1px solid #D4D0C8; padding: 8px 0; }
a { color: #0F1A2E; text-underline-offset: 3px; }
small { color: #5C6470; }
#map[hidden], #geo[hidden] { display: none !important; }
#map { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; }
#map button { padding: 3px 0; font-size: clamp(9px, 2.5vw, 13px); background: #ECE8DF; }

#geo svg { display: block; width: 100%; }
#geo .state-label { pointer-events: none; font-size: 14px; font-weight: 650; fill: #1A1A1A; stroke: #FAF7F1; stroke-width: 3px; paint-order: stroke; }
@media (max-width: 480px) { #geo .state-label { font-size: 18px; } }
#geo path { fill: #ECE8DF; stroke: #FAF7F1; stroke-width: 1.5; cursor: pointer; }
[data-lead="D"] { --map-color: #176697; }
[data-lead="R"] { --map-color: #B52640; }
[data-lead="other"] { --map-color: #36794D; }
[data-lead="mixed"] { --map-color: #5C6470; }
#geo path[data-votes="true"] { fill: var(--map-color); }
#map button[data-votes="true"] { background: var(--map-color); color: #FAF7F1; }
.map-legend[hidden] { display: none; }
.map-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; margin: 6px 0; }
.map-legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border: 1px solid #D4D0C8; background: var(--map-color, #ECE8DF); margin-right: 4px; }
#geo path:focus, #geo path:hover, #geo path[aria-pressed="true"] { stroke: #FF6B1A; stroke-width: 4; outline: none; }
#status-line { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 10px; margin-top: 8px; }
#live { color: #0F1A2E; font-size: 13px; font-weight: 700; }
#live { display: inline-flex; align-items: center; gap: 5px; }
.pulse { display: none; position: relative; width: 18px; height: 18px; color: #FF6B1A; }
#live[data-live="true"] .pulse { display: inline-grid; place-items: center; }
.pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pulse-ring { display: none; position: absolute; inset: 0; border: 1px solid currentColor; border-radius: 50%; }
@media (prefers-reduced-motion: no-preference) {
  .pulse-dot { animation: pulse-dot 1.8s ease-in-out infinite; }
  .pulse-ring { display: block; animation: pulse-ring 1.8s ease-out infinite; }
  .pulse-ring:nth-child(2) { animation-delay: -.6s; }
  .pulse-ring:nth-child(3) { animation-delay: -1.2s; }
}
@keyframes pulse-ring {
  from { transform: scale(.15); opacity: .9; }
  to { transform: scale(1.25); opacity: 0; }
}
@keyframes pulse-dot {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.16); }
}
#vote-summary { margin: 12px 0 20px; font-size: 13px; }
.summary-totals { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
.summary-totals strong { font-size: 21px; font-variant-numeric: tabular-nums; }
.summary-dem { color: #176697; }
.summary-rep { color: #B52640; text-align: right; }
.summary-track { display: flex; height: 14px; background: #D4D0C8; position: relative; border-radius: 4px; }
.summary-track::after { content: ""; position: absolute; left: 50%; inset-block: 0; border-left: 1px solid #1A1A1A; }
#dem-fill { background: #176697; border-radius: 4px 0 0 4px; }
#rep-fill { background: #B52640; border-radius: 0 4px 4px 0; margin-left: auto; }
.summary-mid { text-align: center; font-size: 12px; }
#districts:not([hidden]) { display: grid; grid-template-columns: repeat(auto-fit,minmax(130px,1fr)); gap: 12px; }
.district-group { border-top: 1px solid #D4D0C8; padding-top: 5px; }
.district-group button { width: 38px; margin: 2px; padding: 4px 0; font-size: 13px; background: var(--map-color); color: #FAF7F1; }
.district-group button[aria-pressed="true"] { outline: 2px solid #FF6B1A; outline-offset: 1px; }
main > h1 { color: #FF6B1A; }
#results-layout.house #map button[aria-pressed="true"] { outline: 2px solid #FF6B1A; }
#results-layout.house #districts:not([hidden]) { display: block; }
#results-layout.side-details #cards { grid-template-columns: minmax(0,1fr); }
#house-coverage { font-size: 13px; }
@media (min-width: 700px) {
  #results-layout.side-details { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  #results-layout.side-details #details { max-height: 510px; overflow: auto; padding-right: 4px; }
}
main > nav { justify-content: center; }
main > nav button { flex: 0 0 auto; border-radius: 999px; padding: 5px 14px; font-size: 15px; min-height: 34px; }
main > nav button[aria-pressed="true"] {
  border: 1px solid #FF6B1A;
  background: #FF6B1A;
  color: #1A1A1A;
}
#cards[data-four] { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
</style>
<main>
<h1>2026 美國期中選舉｜重點選區開票</h1>
<div id="status-line"><span id="live"><span class="pulse" aria-hidden="true"><i class="pulse-ring"></i><i class="pulse-ring"></i><i class="pulse-ring"></i><i class="pulse-dot"></i></span><span id="live-label"></span></span><small id="stamp"></small></div>
<nav aria-label="選舉類型"></nav>
<p id="notice" role="status"></p>
<section id="vote-summary" hidden aria-labelledby="vote-heading">
  <b id="vote-heading">已回傳選區的暫計得票占比</b>
  <div class="summary-totals">
    <span class="summary-dem">民主黨 <strong id="dem-share"></strong></span>
    <span class="summary-rep">共和黨 <strong id="rep-share"></strong></span>
  </div>
  <div class="summary-track" aria-hidden="true"><span id="dem-fill"></span><span id="rep-fill"></span></div>
  <div class="summary-mid" aria-hidden="true">50%</div>
  <small id="vote-scope"></small>
</section>
<small id="map-note"></small>
<div id="party-legend" class="map-legend" aria-label="地圖圖例"><b>暫時領先</b>
  <span data-lead="D">民主黨</span><span data-lead="R">共和黨</span>
  <span data-lead="other">其他</span><span data-lead="mixed">並列／無明確領先</span><span>尚無票數</span>
</div>
<p id="house-coverage" hidden>州色表示在已回傳票數的選區中，暫時領先區數最多的政黨。點州查看各區。</p>
<div id="results-layout"><div>
<div id="geo" role="group" aria-label="美國州界地圖"></div>
<div id="map" role="group" aria-label="美國各州格網地圖"></div>
</div><div id="details">
<p id="district-count" hidden></p><div id="districts" hidden></div>
<p><button id="reset" hidden>回到重點選區</button></p>
<h2 id="focus-title" hidden></h2>
<ul id="cards"></ul>
<small id="missing-focus" hidden></small>
</div></div>
<small>資料來源： <a href="https://openamerica.io/elections/api/" target="_blank" rel="noopener noreferrer">各州選務機關經 Open America 提供</a>（<a href="https://openamerica.io/elections/api/#coverage" target="_blank" rel="noopener noreferrer">查看涵蓋州別</a>）<br>
註：地圖顏色依已回傳票數標示暫時領先情況。勝負以各州認證結果為準。</small>
</main>
<script>
const labels = { Senate: '參議院', House: '眾議院', Governor: '州長' };
const stateNames = Object.fromEntries('AL:阿拉巴馬 AK:阿拉斯加 AZ:亞利桑那 AR:阿肯色 CA:加州 CO:科羅拉多 CT:康乃狄克 DE:德拉瓦 FL:佛羅里達 GA:喬治亞 HI:夏威夷 ID:愛達荷 IL:伊利諾 IN:印第安納 IA:愛荷華 KS:堪薩斯 KY:肯塔基 LA:路易斯安那 ME:緬因 MD:馬里蘭 MA:麻薩諸塞 MI:密西根 MN:明尼蘇達 MS:密西西比 MO:密蘇里 MT:蒙大拿 NE:內布拉斯加 NV:內華達 NH:新罕布夏 NJ:紐澤西 NM:新墨西哥 NY:紐約 NC:北卡羅來納 ND:北達科他 OH:俄亥俄 OK:奧克拉荷馬 OR:奧勒岡 PA:賓夕法尼亞 RI:羅德島 SC:南卡羅來納 SD:南達科他 TN:田納西 TX:德州 UT:猶他 VT:佛蒙特 VA:維吉尼亞 WA:華盛頓 WV:西維吉尼亞 WI:威斯康辛 WY:懷俄明'.split(' ').map(entry => entry.split(':')));
function placeName(key) {
  const [state, district] = key.split('-');
  const name = stateNames[state];
  if (!name) return key;
  const base = name.endsWith('州') ? name : name + '州';
  if (!district) return base;
  if (district === '00') return base + '全州選區';
  if (district === 'special') return base + '補選';
  return base + '第 ' + Number(district) + ' 選區';
}
const focus = { Senate: ['GA','MI','NC','TX'], House: ['AZ-01','MI-07','PA-07','TX-34'], Governor: ['AZ','GA','MI','IA'] };
const parties = { D: '民主黨', R: '共和黨', I: '無黨籍', L: '自由意志黨' };
const cache = new Map();
const byId = id => document.getElementById(id);
const time = new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', dateStyle: 'medium', timeStyle: 'short' });
const mapRows = [
  'AK -- -- -- -- -- -- -- -- -- -- ME',
  '-- WA ID MT ND MN WI MI IL NY VT NH',
  '-- OR NV WY SD IA IN OH PA NJ CT MA',
  '-- CA UT CO NE MO KY WV VA MD DE RI',
  '-- -- AZ NM KS AR TN NC SC -- -- --',
  'HI -- -- -- OK LA MS AL GA -- -- --',
  '-- -- -- -- TX -- -- -- FL -- -- --'
];
let stateFilter = '';
let districtFilter = '';
let selected = 'Senate';
let timer;
let request;

function parseFeed(data, office) {
  if (data.api !== 1 || data.year !== 2026 || data.office !== office ||
      !data.races || typeof data.races !== 'object' || Array.isArray(data.races)) {
    throw new Error('Unexpected feed');
  }
  return data;
}

function hasVotes(race) {
  return Array.isArray(race?.cands) && race.cands.some(candidate => candidate.v > 0);
}

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

function render(error = false, previous) {
  const data = cache.get(selected);
  byId('notice').textContent = error
    ? (data ? '更新暫停，顯示上次取得的資料。' : '暫時無法取得資料，稍後自動重試。')
    : data?.stale ? '來源更新延遲。' : data ? '' : '正在讀取開票資料。';
  byId('stamp').textContent = Number.isFinite(Date.parse(data?.as_of))
    ? '更新時間（台灣） ' + time.format(new Date(data.as_of)) : '';
  const live = Boolean(data?.live && !data.stale && !error);
  byId('live').dataset.live = String(live);
  byId('live-label').textContent = live ? '即時開票' : data ? '暫計票數' : '';
  renderVoteSummary(data, Boolean(previous));
  const house = selected === 'House';
  byId('results-layout').classList.toggle('house', house);
  byId('results-layout').classList.toggle('side-details', house || Boolean(stateFilter));
  byId('party-legend').hidden = false;
  byId('house-coverage').hidden = !house;
  byId('districts').hidden = !house;
  byId('district-count').hidden = !house;

  const focusTitle = byId('focus-title');
  focusTitle.textContent = house ? '眾議院焦點選區' : '參議院焦點選區';
  focusTitle.hidden = !data || selected === 'Governor' || Boolean(stateFilter || districtFilter);
  byId('cards').replaceChildren();
  byId('cards').removeAttribute('data-four');
  byId('missing-focus').hidden = true;
  if (!data) {
    byId('map').replaceChildren();
    byId('reset').hidden = true;
    return;
  }
  renderMap(data);
  if (house) renderDistricts(data);
  byId('reset').hidden = !(districtFilter || stateFilter);
  const stateKeys = Object.keys(data.races).filter(key => key.slice(0, 2) === stateFilter).sort();
  let keys = (districtFilter ? [districtFilter] : stateFilter ? (house ? [] : stateKeys) : [...focus[selected]]).sort(
    (a, b) => Number(hasVotes(data.races[b])) - Number(hasVotes(data.races[a]))
  );
  if (!stateFilter && !districtFilter) {
    const missing = keys.filter(key => !hasVotes(data.races[key]));
    const note = byId('missing-focus');
    note.hidden = !missing.length;
    note.textContent = missing.map(placeName).join('、') + '｜本配件尚未取得票數';
    keys = keys.filter(key => hasVotes(data.races[key]));
    byId('cards').toggleAttribute('data-four', keys.length === 4);
  }
  if (stateFilter && !keys.length && !house) {
    const empty = document.createElement('li');
    empty.textContent = placeName(stateFilter) + '｜來源未提供此州的' + labels[selected] + '票數';
    byId('cards').append(empty);
  }
  for (const key of keys) {
    const race = data.races[key];
    const card = document.createElement('li');
    const heading = document.createElement('strong');
    heading.textContent = placeName(key) + '（' + key + '）';
    card.append(heading);
    const candidates = Array.isArray(race?.cands) ? race.cands.filter(
      c => typeof c.n === 'string' && Number.isSafeInteger(c.v) && c.v >= 0
    ).sort((a,b) => b.v - a.v) : [];
    if (!candidates.some(c => c.v > 0)) {
      card.setAttribute('data-empty', '');
      card.append(race ? '尚無票數' : '來源未提供此選區資料');
    } else {
      const header = document.createElement('div');
      header.className = 'candidate-head';
      for (const label of ['候選人／政黨', '票數／得票率']) {
        const cell = document.createElement('span');
        cell.textContent = label;
        header.append(cell);
      }
      card.append(header);
      for (const c of candidates.slice(0, 3)) {
        const row = document.createElement('div');
        row.className = 'candidate';
        row.dataset.party = c.p || '';
        const name = document.createElement('div');
        name.className = 'candidate-name';
        name.textContent = c.n;
        const party = document.createElement('span');
        party.className = 'candidate-meta';
        party.textContent = parties[c.p] || c.p || '';
        name.append(party);
        const count = document.createElement('div');
        count.className = 'candidate-count';
        const votes = document.createElement('span');
        count.append(votes);
        const old = previous?.races[key]?.cands?.find(candidate => candidate.n === c.n && candidate.p === c.p)?.v;
        animateVotes(votes, old, c.v);
        row.append(name, count);
        if (Number.isFinite(c.pct) && c.pct >= 0 && c.pct <= 100) {
          const percent = document.createElement('span');
          percent.className = 'candidate-meta';
          percent.textContent = c.pct.toFixed(1) + '%';
          count.append(percent);
        }
        card.append(row);
      }
      if (candidates.length > 3) {
        const remaining = document.createElement('small');
        remaining.textContent = '另有 ' + (candidates.length - 3) + ' 位候選人';
        card.append(remaining);
      }
    }
    byId('cards').append(card);
  }
}

function animateVotes(node, previous, latest) {
  const show = value => { node.textContent = value.toLocaleString('zh-TW') + ' 票'; };
  show(latest);
  if (reducedMotion.matches || !Number.isSafeInteger(previous) || previous >= latest) return;
  const start = performance.now();
  const frame = now => {
    if (!node.isConnected) return;
    const progress = Math.min(1, Math.max(0, (now - start) / 400));
    show(Math.round(previous + (latest - previous) * (1 - (1 - progress) ** 3)));
    if (progress < 1) requestAnimationFrame(frame);
  };
  show(previous);
  requestAnimationFrame(frame);
}

function renderVoteSummary(data, animate) {
  const totals = { D: 0, R: 0, other: 0 };
  let races = 0;
  const scope = districtFilter || stateFilter;
  const entries = Object.entries(data?.races || {}).filter(([key]) =>
    districtFilter ? key === districtFilter : !stateFilter || key.slice(0, 2) === stateFilter
  );
  byId('vote-heading').textContent = scope
    ? placeName(scope) + '｜暫計得票占比' : '已回傳選區的暫計得票占比';
  for (const [, race] of entries) {
    if (!hasVotes(race)) continue;
    races++;
    for (const candidate of race.cands) {
      if (!Number.isSafeInteger(candidate.v) || candidate.v < 0) continue;
      const party = candidate.p === 'D' || candidate.p === 'R' ? candidate.p : 'other';
      totals[party] += candidate.v;
    }
  }
  const total = totals.D + totals.R + totals.other;
  byId('vote-summary').hidden = !total;
  if (!total) return;
  for (const [party, id] of [['D', 'dem'], ['R', 'rep']]) {
    const percent = totals[party] / total * 100;
    byId(id + '-share').textContent = percent.toFixed(1) + '%';
    const fill = byId(id + '-fill');
    fill.style.transition = animate && !reducedMotion.matches ? 'width 400ms ease-out' : 'none';
    fill.style.width = percent + '%';
  }
  byId('vote-scope').textContent = '統計已回傳票數的 ' + races + ' 場選舉。灰色為其他政黨及無黨籍。';
}

function renderDistricts(data) {
  const grid = byId('districts');
  grid.replaceChildren();

  const entries = Object.entries(data?.races || {}).filter(([key, race]) =>
    /^[A-Z]{2}-\d{2}$/.test(key) && hasVotes(race)).sort(([a], [b]) => a.localeCompare(b));
  const visible = entries.filter(([key]) => key.startsWith(stateFilter + '-'));
  byId('district-count').textContent = stateFilter
    ? placeName(stateFilter) + '｜' + (visible.length ? '已取得 ' + visible.length + ' 區票數，色塊表示暫時領先。' : '尚未取得選區票數。')
    : '已取得 ' + entries.length + ' 區票數。點州查看選區。';
  const groups = new Map();
  for (const [key, race] of visible) {
    const [state, district] = key.split('-');
    if (!groups.has(state)) {
      const group = document.createElement('section');
      group.className = 'district-group';
      const label = document.createElement('b');
      label.textContent = state;
      group.append(label, document.createElement('br'));
      groups.set(state, group);
      grid.append(group);
    }
    const top = Math.max(...race.cands.map(c => c.v).filter(Number.isFinite));
    const leaders = race.cands.filter(c => c.v === top);
    const party = leaders[0]?.p;
    const lead = leaders.length !== 1 || !party ? 'mixed' : ['D','R'].includes(party) ? party : 'other';
    const button = document.createElement('button');
    button.textContent = district === '00' ? '全州' : district;
    button.dataset.lead = lead;
    const status = { D: '民主黨領先', R: '共和黨領先', other: '其他領先', mixed: '並列或未確認領先黨' };
    button.setAttribute('aria-label', key + ' ' + status[lead]);
    button.setAttribute('aria-pressed', String(key === districtFilter));
    button.addEventListener('click', () => {
      districtFilter = key;
      render();
      byId('districts').querySelector('[aria-pressed="true"]')?.focus({ preventScroll: true });
      byId('cards').scrollIntoView({ block: 'nearest' });
    });
    groups.get(state).append(button);
  }
}

function renderMap(data) {
  const map = byId('map');
  const leadsByState = new Map();
  const houseLeads = new Map();
  const knownStates = new Set(mapRows.flatMap(row => row.split(' ')));
  for (const [key, race] of Object.entries(data.races)) {
    const state = key.slice(0, 2);
    if (!knownStates.has(state) || !hasVotes(race)) continue;
    const votes = race.cands.map(candidate => candidate.v).filter(Number.isFinite);
    const top = Math.max(...votes);
    const leaders = race.cands.filter(candidate => candidate.v === top);
    const party = leaders[0]?.p;
    const lead = leaders.length !== 1 || !party ? 'mixed'
      : party === 'D' || party === 'R' ? party : 'other';
    if (!leadsByState.has(state)) leadsByState.set(state, new Set());
    leadsByState.get(state).add(lead);
    if (selected === 'House' && leaders.length === 1 && party) {
      if (!houseLeads.has(state)) houseLeads.set(state, new Map());
      const counts = houseLeads.get(state);
      counts.set(party, (counts.get(party) || 0) + 1);
    }
  }
  byId('map-note').textContent = selected === 'House'
    ? ''
    : '顏色表示暫時領先。點州查看暫計票數。';
  if (!map.children.length) {
    mapRows.forEach((row, y) => row.split(' ').forEach((state, x) => {
      if (state === '--') return;
      const tile = document.createElement('button');
      tile.textContent = state;
      tile.style.gridArea = (y + 1) + ' / ' + (x + 1);
      tile.addEventListener('click', () => { stateFilter = state; districtFilter = ''; render(); });
      map.append(tile);
    }));
  }
  for (const tile of [...map.children, ...byId('geo').querySelectorAll('path')]) {
    const state = tile.dataset.state || tile.textContent;
    const leads = leadsByState.get(state);
    const available = Boolean(leads);
    let lead = !leads ? '' : leads.size === 1 ? leads.values().next().value : 'mixed';
    if (selected === 'House' && available) {
      const ranked = [...(houseLeads.get(state) || [])].sort((a, b) => b[1] - a[1]);
      const first = ranked[0];
      lead = !first || first[1] === ranked[1]?.[1] ? 'mixed'
        : first[0] === 'D' || first[0] === 'R' ? first[0] : 'other';
    }
    tile.dataset.lead = lead;
    const status = { D: '民主黨領先', R: '共和黨領先', other: '其他領先',
      mixed: '並列或無明確領先', '': '尚無票數' };
    tile.dataset.votes = String(available);
    tile.setAttribute('aria-label', (tile.dataset.name || state) + ' ' + status[lead]);
    tile.setAttribute('aria-pressed', String(state === stateFilter));
  }
  byId('reset').hidden = !stateFilter;
}

byId('reset').addEventListener('click', () => { stateFilter = ''; districtFilter = ''; render(); });

async function refresh(office, failures = 0, animate = true) {
  const controller = new AbortController();
  request = controller;
  const deadline = setTimeout(() => controller.abort(), 12000);
  let delay = 60000;
  try {
    const response = await fetch('https://openamerica.io/elections/results.json?year=2026&office=' + office,
      { credentials: 'omit', signal: controller.signal });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = parseFeed(await response.json(), office);
    if (request !== controller) return;
    const previous = cache.get(office);
    cache.set(office, data);
    render(false, animate ? previous : undefined);
    failures = 0;
    if (!Object.keys(data.races).length || data.final) delay = 600000;
  } catch {
    if (request !== controller) return;
    render(true);
    delay = Math.min(600000, 60000 * 2 ** ++failures);
  } finally {
    clearTimeout(deadline);
    if (request === controller) timer = setTimeout(() => refresh(office, failures), delay);
  }
}

function select(office) {
  clearTimeout(timer);
  request?.abort();
  selected = office;
  stateFilter = '';
  districtFilter = '';
  for (const button of document.querySelectorAll('nav button')) {
    button.setAttribute('aria-pressed', String(button.dataset.office === office));
  }
  render();
  refresh(office, 0, false);
}
for (const [office, label] of Object.entries(labels)) {
  const button = document.createElement('button');
  button.dataset.office = office;
  button.textContent = label;
  button.addEventListener('click', () => select(office));
  document.querySelector('nav').append(button);
}
select(selected);

const cards = byId('cards');
const spotlight = matchMedia('(hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference)');
let spotlightFrame;
cards.addEventListener('pointermove', event => {
  if (!spotlight.matches || event.pointerType !== 'mouse') return;
  cancelAnimationFrame(spotlightFrame);
  spotlightFrame = requestAnimationFrame(() => {
    for (const card of cards.children) {
      const bounds = card.getBoundingClientRect();
      card.style.setProperty('--x', (event.clientX - bounds.left) + 'px');
      card.style.setProperty('--y', (event.clientY - bounds.top) + 'px');
    }
    cards.setAttribute('data-spotlight', '');
  });
});
cards.addEventListener('pointerleave', () => {
  cancelAnimationFrame(spotlightFrame);
  cards.removeAttribute('data-spotlight');
});

async function loadGeography() {
  const base = 'https://cdn.jsdelivr.net/npm/';
  const [topology, topojson, d3] = await Promise.all([
    fetch(base + 'us-atlas@3.0.1/states-albers-10m.json').then(response => {
      if (!response.ok) throw new Error('Map unavailable');
      return response.json();
    }),
    import(base + 'topojson-client@3.1.0/+esm'),
    import(base + 'd3-geo@3.1.1/+esm')
  ]);
  const codes = '01AL 02AK 04AZ 05AR 06CA 08CO 09CT 10DE 12FL 13GA 15HI 16ID 17IL 18IN 19IA 20KS 21KY 22LA 23ME 24MD 25MA 26MI 27MN 28MS 29MO 30MT 31NE 32NV 33NH 34NJ 35NM 36NY 37NC 38ND 39OH 40OK 41OR 42PA 44RI 45SC 46SD 47TN 48TX 49UT 50VT 51VA 53WA 54WV 55WI 56WY';
  const states = Object.fromEntries(codes.split(' ').map(pair => [pair.slice(0,2), pair.slice(2)]));
  const svgElement = tag => document.createElementNS('http://www.w3.org/2000/svg', tag);
  const svg = svgElement('svg');
  svg.setAttribute('viewBox', '0 0 975 610');
  const path = d3.geoPath();
  const labelsLayer = svgElement('g');
  labelsLayer.setAttribute('aria-hidden', 'true');
  const smallStates = new Set(['CT', 'DE', 'MA', 'MD', 'NH', 'NJ', 'RI', 'VT']);
  for (const feature of topojson.feature(topology, topology.objects.states).features) {
    const state = states[feature.id];
    if (!state) continue;
    const tile = svgElement('path');
    tile.dataset.state = state;
    tile.dataset.name = feature.properties.name;
    tile.setAttribute('d', path(feature));
    tile.setAttribute('role', 'button');
    tile.setAttribute('tabindex', '0');
    tile.setAttribute('aria-label', tile.dataset.name);
    const title = svgElement('title');
    title.textContent = tile.dataset.name;
    tile.append(title);
    const activate = () => { stateFilter = state; districtFilter = ''; render(); };
    tile.addEventListener('click', activate);
    tile.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); activate(); }
    });
    svg.append(tile);
    const [x, y] = path.centroid(feature);
    if (!smallStates.has(state) && Number.isFinite(x) && Number.isFinite(y)) {
      const label = svgElement('text');
      label.setAttribute('class', 'state-label');
      label.setAttribute('x', x);
      label.setAttribute('y', y);
      label.setAttribute('text-anchor', 'middle');
      label.setAttribute('dominant-baseline', 'central');
      label.textContent = state;
      labelsLayer.append(label);
    }
  }
  if (svg.children.length !== 50) throw new Error('Incomplete map');
  svg.append(labelsLayer);
  byId('geo').append(svg);
  byId('map').style.display = 'none';
  if (cache.has(selected)) renderMap(cache.get(selected));
}
loadGeography().catch(() => {});

</script>
